apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_COLOR: "blue"
  APP_MODE: "production"
---
apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo-pod
spec:
  containers:
  - name: demo-container
    image: busybox
    command: [ "/bin/sh", "-c", "env | grep APP_ && sleep 3600" ]
    envFrom:
    - configMapRef:
        name: app-config
